[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastlinkage"
version = "0.1.0"
description = "Exact hierarchical clustering (Ward, average linkage) on the GPU, without the n x n distance matrix"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Michael Li" }]
keywords = ["hierarchical clustering", "agglomerative", "linkage", "gpu", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.1"]

[project.optional-dependencies]
test = ["pytest", "scikit-learn"]
bench = ["fastcluster", "scikit-learn", "sentence-transformers", "datasets"]

[tool.hatch.build.targets.wheel]
packages = ["src/fastlinkage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
