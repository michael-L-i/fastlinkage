[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastlinkage"
dynamic = ["version"]
description = "Exact hierarchical clustering (Ward, average linkage) on the GPU, without the n x n distance matrix"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Michael Li" }]
keywords = ["hierarchical clustering", "agglomerative", "linkage", "gpu", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.1"]

[project.optional-dependencies]
test = ["pytest", "scikit-learn"]
dev = ["pytest", "scikit-learn", "ruff"]
bench = ["fastcluster", "scikit-learn", "sentence-transformers", "datasets"]

[project.urls]
Homepage = "https://github.com/michael-L-i/fastlinkage"
Issues = "https://github.com/michael-L-i/fastlinkage/issues"
Changelog = "https://github.com/michael-L-i/fastlinkage/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/fastlinkage/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.hatch.build.targets.wheel]
packages = ["src/fastlinkage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E741"]   # short names (l, I) follow the maths

[tool.ruff.lint.isort]
known-first-party = ["fastlinkage"]

[tool.ruff.lint.per-file-ignores]
"experiments/make_charts.py" = ["E501"]   # SVG markup
